services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  urban-radar:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      TELEGRAM_HOME_CHANNEL: ${TELEGRAM_HOME_CHANNEL:?TELEGRAM_HOME_CHANNEL must be set}
      ALL_PROXY: socks5://host.docker.internal:10808
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      ZAKUPKI_SEARCH_URL: ${ZAKUPKI_SEARCH_URL:?ZAKUPKI_SEARCH_URL must be set}
      ZAKUPKI_CA_FILE: ${ZAKUPKI_CA_FILE:-}
      HERMES_HOME: /var/lib/hermes
      HOME: /home/urban-radar
      TMPDIR: /tmp
      URBAN_RADAR_MEDIA_DIR: /var/lib/urban-radar/media
      URBAN_RADAR_REVIEW_NOTIFY_COMMAND: /var/lib/hermes/plugins/urban-radar-telegram-review-experiment/review_notify.py
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:?VK_ACCESS_TOKEN must be set}
      VK_GROUP_ID: ${VK_GROUP_ID:?VK_GROUP_ID must be set}
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ${HERMES_HOME_HOST_DIR:?HERMES_HOME_HOST_DIR must be set}
        target: /var/lib/hermes
      - type: bind
        source: ${ZAKUPKI_CA_HOST_PATH:-/dev/null}
        target: /run/secrets/Russian_Trusted_CA.pem
        read_only: true
      - type: bind
        source: ${URBAN_RADAR_MEDIA_HOST_DIR:?URBAN_RADAR_MEDIA_HOST_DIR must be set}
        target: /var/lib/urban-radar/media

  hermes-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      TELEGRAM_HOME_CHANNEL: ${TELEGRAM_HOME_CHANNEL:?TELEGRAM_HOME_CHANNEL must be set}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:?TELEGRAM_ALLOWED_USERS must be set}
      ALL_PROXY: socks5://host.docker.internal:10808
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      HERMES_HOME: /var/lib/hermes
      HOME: /home/urban-radar
      TMPDIR: /tmp
      URBAN_RADAR_MEDIA_DIR: /var/lib/urban-radar/media
      URBAN_RADAR_REVIEW_COMMAND: /usr/local/bin/urban-radar
      URBAN_RADAR_REVIEW_COMMAND_TIMEOUT_SECONDS: ${URBAN_RADAR_REVIEW_COMMAND_TIMEOUT_SECONDS:-45}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:?VK_ACCESS_TOKEN must be set}
      VK_GROUP_ID: ${VK_GROUP_ID:?VK_GROUP_ID must be set}
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    entrypoint: ["/usr/bin/tini", "--", "/opt/hermes-venv/bin/hermes"]
    command: ["gateway"]
    volumes:
      - type: bind
        source: ${HERMES_HOME_HOST_DIR:?HERMES_HOME_HOST_DIR must be set}
        target: /var/lib/hermes
      - type: bind
        source: ${URBAN_RADAR_MEDIA_HOST_DIR:?URBAN_RADAR_MEDIA_HOST_DIR must be set}
        target: /var/lib/urban-radar/media

volumes:
  postgres_data:
