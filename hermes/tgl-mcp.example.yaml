# Add this stdio MCP server with Hermes 0.21.0.
# Replace /srv/urban-radar with the project directory on the target machine.
mcp_servers:
  urban-radar-tgl:
    command: go
    args: ["run", "/srv/urban-radar/cmd/tgl-mcp"]
    timeout: 30
    connect_timeout: 15
    tools:
      include: ["tgl_list_news", "tgl_get_news"]

  urban-radar-zakupki:
    command: go
    args: ["run", "/srv/urban-radar/cmd/zakupki-mcp"]
    timeout: 60
    connect_timeout: 20
    tools:
      include:
        - get_procurement
        - list_procurement_documents
        - get_procurement_document
        - list_procurement_attachments
        - get_procurement_attachment
